<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Warhammer Survivors Bit Box Planner</title>
    <style>
        /* ==========================================================================
           1. DESIGN TOKENS & UNIVERSE THEMES
           ========================================================================== */
        :root {
            --font-sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            --radius-sm: 0.25rem;
            --radius-md: 0.375rem;
            --radius-lg: 0.5rem;

            --zinc-950: #09090b;
            --zinc-900: #18181b;
            --zinc-800: #27272a;
            --zinc-700: #3f3f46;
            --zinc-500: #71717a;
            --zinc-400: #a1a1aa;
            --zinc-300: #d4d4d8;
            --zinc-200: #e4e4e7;
            --zinc-100: #f4f4f5;

            /* Semantic State Tones */
            --tone-char-bg: color-mix(in srgb, #451a03 75%, transparent);     --tone-char-bd: #fbbf24;     --tone-char-fg: #fcd34d;
            --tone-selected-bg: color-mix(in srgb, #064e3b 70%, transparent);  --tone-selected-bd: #34d399; --tone-selected-fg: #6ee7b7;
            --tone-stage-bg: color-mix(in srgb, #0c4a6e 70%, transparent);   --tone-stage-bd: #38bdf8;    --tone-stage-fg: #7dd3fc;
            --tone-grant-bg: color-mix(in srgb, #134e4a 75%, transparent);   --tone-grant-bd: #2dd4bf;    --tone-grant-fg: #99f6e4;
            --tone-synergy-bg: color-mix(in srgb, #4a044e 80%, transparent);   --tone-synergy-bd: #e879f9;  --tone-synergy-fg: #f5d0fe;
            --tone-upgrade-bg: color-mix(in srgb, #431407 85%, transparent);  --tone-upgrade-bd: #fb923c;  --tone-upgrade-fg: #fed7aa;
            --tone-done-bg: color-mix(in srgb, #422006 85%, transparent);     --tone-done-bd: #fde047;     --tone-done-fg: #fef08a;
            --tone-sealed-bg: color-mix(in srgb, #450a0a 75%, transparent);  --tone-sealed-bd: #dc2626;   --tone-sealed-fg: #fca5a5;
            --tone-muted-bg: #18181b;                  --tone-muted-bd: #3f3f46;    --tone-muted-fg: #71717a;
            --tone-alt-bg: color-mix(in srgb, #3b0764 90%, transparent);      --tone-alt-bd: color-mix(in srgb, #9333ea 80%, transparent); --tone-alt-fg: #e9d5ff;

            /* Button Variant Colors */
            --btn-primary-bg: #059669;
            --btn-amber-bg: #d97706;
            --btn-share-hover-bg: color-mix(in srgb, #065f46 85%, transparent);
            --btn-share-hover-fg: #ecfdf5;

            /* 40K Default Theme */
            --bg-page: #100f0f;
            --bg-pattern: repeating-linear-gradient(0deg, color-mix(in srgb, #10b981 3%, transparent) 0 1px, transparent 1px 3px);
            --bg-header: color-mix(in srgb, #0a100c 95%, transparent);
            --bd-header: #1c3326;
            --header-top: transparent;
            --bg-panel: #0b110d;
            --bd-panel: #1c3326;
            --bd-divider: #1c3326;
            --bg-subpanel: #100f0f;
            --accent-1: #34d399;
            --accent-2: #34d399;
            --accent-soft: color-mix(in srgb, #064e3b 90%, transparent);
            --accent-soft-fg: #a7f3d0;
            --accent-bd: color-mix(in srgb, #10b981 80%, transparent);
            --accent-glow: color-mix(in srgb, #10b981 20%, transparent);
            --subtitle-fg: color-mix(in srgb, #a7f3d0 60%, transparent);
            --emblem-bg: #0e1f15;
            --emblem-bd: color-mix(in srgb, #047857 80%, transparent);
            --box-bg: #151814;
            --box-bd: color-mix(in srgb, #059669 80%, transparent);
            --box-glow: color-mix(in srgb, #10b981 12%, transparent);
            --dd-hover-bg: #122018;
            --dd-hover-fg: #d1fae5;
            --bracket-top: #a1a1aa;
            --bracket-side: #71717a;
        }

        [data-universe="aos"] {
            --bg-page: #0d1628;
            --bg-pattern:
                    radial-gradient(circle at 75% 25%, color-mix(in srgb, #eab308 6%, transparent), transparent 55%),
                    radial-gradient(circle at 20% 80%, color-mix(in srgb, #38bdf8 5%, transparent), transparent 50%);
            --bg-header: color-mix(in srgb, #0c111e 95%, transparent);
            --bd-header: color-mix(in srgb, #b45309 50%, transparent);
            --header-top: color-mix(in srgb, #fbbf24 80%, transparent);
            --bg-panel: #0c111d;
            --bd-panel: color-mix(in srgb, #92400e 50%, transparent);
            --bd-divider: color-mix(in srgb, #78350f 50%, transparent);
            --bg-subpanel: #0d1628;
            --accent-1: #38bdf8;
            --accent-2: #fbbf24;
            --accent-soft: color-mix(in srgb, #451a03 90%, transparent);
            --accent-soft-fg: #fde68a;
            --accent-bd: color-mix(in srgb, #fbbf24 80%, transparent);
            --accent-glow: color-mix(in srgb, #f59e0b 25%, transparent);
            --subtitle-fg: color-mix(in srgb, #fef3c7 60%, transparent);
            --emblem-bg: #17140b;
            --emblem-bd: color-mix(in srgb, #f59e0b 80%, transparent);
            --box-bg: #291c0e;
            --box-bd: color-mix(in srgb, #f59e0b 75%, transparent);
            --box-glow: color-mix(in srgb, #f59e0b 14%, transparent);
            --dd-hover-bg: #141c30;
            --dd-hover-fg: #fef3c7;
            --bracket-top: #fcd34d;
            --bracket-side: #f59e0b;
        }

        /* ==========================================================================
           2. RESET, LAYOUT & UTILITIES
           ========================================================================== */
        *, *::before, *::after { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: var(--font-sans);
            background: var(--bg-page);
            color: var(--zinc-200);
            -webkit-font-smoothing: antialiased;
        }
        ::selection { background: #d97706; color: var(--zinc-950); }
        button, input, select { font: inherit; color: inherit; }
        button { cursor: pointer; background: none; border: 0; padding: 0; }
        button:disabled { cursor: not-allowed; opacity: 0.5; }
        [hidden] { display: none !important; }

        .ws-app {
            min-height: 100vh;
            background-color: var(--bg-page);
            background-image: var(--bg-pattern);
            padding-bottom: 4rem;
            transition: background-color 0.25s ease;
        }
        .ws-container { max-width: 80rem; margin-inline: auto; padding-inline: 1rem; }
        .ws-layout { display: grid; grid-template-columns: 1fr; gap: 1.5rem; padding-top: 1.5rem; }
        @media (min-width: 1024px) {
            .ws-layout { grid-template-columns: repeat(12, minmax(0, 1fr)); }
            .ws-col-left { grid-column: span 5; }
            .ws-col-right { grid-column: span 7; }
        }

        .ws-stack { display: flex; flex-direction: column; gap: 1.5rem; }
        .ws-stack-md { display: flex; flex-direction: column; gap: 0.75rem; }
        .ws-stack-sm { display: flex; flex-direction: column; gap: 0.5rem; }
        .ws-stack-xs { display: flex; flex-direction: column; gap: 0.375rem; }
        .ws-row { display: flex; align-items: center; gap: 0.5rem; }
        .ws-row-sm { display: flex; align-items: center; gap: 0.375rem; }
        .ws-row-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 0.375rem; }
        .ws-between { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
        .ws-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ws-min-0 { min-width: 0; }
        .ws-shrink-0 { flex-shrink: 0; }
        .ws-flex-1 { flex: 1; }
        .ws-rel { position: relative; }
        .ws-mono { font-family: var(--font-mono); }
        .ws-meta { font-size: 0.6875rem; color: var(--zinc-400); }
        .ws-empty {
            margin: 0;
            padding: 0.625rem;
            font-size: 0.75rem;
            color: var(--zinc-500);
            font-style: italic;
            background: var(--bg-subpanel);
            border: 1px solid var(--bd-panel);
            border-radius: var(--radius-sm);
        }
        .ws-grid-empty { padding-block: 2rem; text-align: center; font-size: 0.75rem; color: var(--zinc-500); font-style: italic; }

        /* ==========================================================================
           3. HEADER, BUTTONS & SEGMENTED TABS
           ========================================================================== */
        .ws-header {
            position: sticky;
            top: 0;
            z-index: 30;
            background: var(--bg-header);
            border-bottom: 1px solid var(--bd-header);
            border-top: 2px solid var(--header-top);
            backdrop-filter: blur(6px);
        }
        .ws-header-inner {
            padding-block: 0.75rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }
        .ws-emblem {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: var(--radius-md);
            background: var(--emblem-bg);
            border: 1px solid var(--emblem-bd);
            box-shadow: inset 0 0 12px var(--accent-glow);
            color: var(--accent-2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .ws-title {
            margin: 0;
            font-size: 1rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--zinc-100);
            line-height: 1.1;
        }
        @media (min-width: 640px) { .ws-title { font-size: 1.125rem; } }
        .ws-title span { color: var(--accent-2); }
        .ws-subtitle { margin: 0.25rem 0 0; font-family: var(--font-mono); font-size: 0.6875rem; color: var(--subtitle-fg); }

        .ws-segmented {
            display: inline-flex;
            padding: 0.25rem;
            border-radius: var(--radius-md);
            background: var(--bg-subpanel);
            border: 1px solid var(--bd-panel);
            gap: 0.125rem;
        }
        .ws-seg-btn {
            padding: 0.25rem 0.625rem;
            border-radius: var(--radius-sm);
            font-size: 0.6875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--zinc-400);
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            transition: color 0.15s, background-color 0.15s;
        }
        .ws-seg-btn:hover { color: var(--zinc-200); }
        .ws-seg-btn[aria-pressed="true"] {
            background: var(--accent-soft);
            color: var(--accent-soft-fg);
            border-color: var(--accent-bd);
            box-shadow: 0 0 10px var(--accent-glow);
        }
        .ws-seg-btn[data-variant="synergy"][aria-pressed="true"] {
            background: var(--tone-synergy-bg);
            color: var(--tone-synergy-fg);
            border-color: var(--tone-synergy-bd);
        }
        .ws-seg-count {
            padding: 0 0.25rem;
            border-radius: 2px;
            background: #d946ef;
            color: var(--zinc-950);
            font-size: 0.5625rem;
            font-weight: 900;
            line-height: 1.3;
        }

        .ws-btn {
            padding: 0.375rem 0.75rem;
            border-radius: var(--radius-md);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            border: 1px solid var(--zinc-800);
            background: var(--zinc-950);
            color: var(--zinc-400);
            flex-shrink: 0;
            transition: background-color 0.15s, border-color 0.15s, color 0.15s;
        }
        .ws-btn:hover { border-color: var(--tone-sealed-bd); background: var(--tone-sealed-bg); color: var(--tone-sealed-fg); }
        .ws-btn[data-variant="share"] { background: var(--accent-soft); border-color: var(--accent-bd); color: var(--accent-soft-fg); }
        .ws-btn[data-variant="share"]:hover { background: var(--btn-share-hover-bg); color: var(--btn-share-hover-fg); }
        .ws-btn[data-variant="primary"] { background: var(--btn-primary-bg); border-color: var(--accent-1); color: var(--zinc-950); }
        .ws-btn[data-variant="primary"]:hover { background: var(--accent-1); }
        .ws-btn[data-variant="amber"] { background: var(--btn-amber-bg); border-color: var(--accent-2); color: var(--zinc-950); }
        .ws-btn[data-variant="amber"]:hover { background: var(--accent-2); }

        .ws-hide-mobile { display: none; }
        @media (min-width: 640px) { .ws-hide-mobile { display: inline; } }

        /* ==========================================================================
           4. PANELS, INPUTS, DROPDOWN & CALLOUTS
           ========================================================================== */
        .ws-panel {
            background: var(--bg-panel);
            border: 1px solid var(--bd-panel);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.55);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .ws-panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--bd-divider);
        }
        .ws-heading, .ws-sub-heading {
            margin: 0;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent-1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .ws-heading { font-size: 0.875rem; letter-spacing: 0.08em; }
        .ws-sub-heading { font-size: 0.75rem; letter-spacing: 0.06em; }
        .ws-heading svg, .ws-sub-heading svg { color: var(--accent-2); }

        .ws-section-label {
            font-size: 0.6875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }
        .ws-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--zinc-400);
            margin-bottom: 0.375rem;
        }
        .ws-label-sm { font-size: 0.6875rem; }

        .ws-input-icon { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--zinc-500); pointer-events: none; display: flex; }
        .ws-input-clear { position: absolute; right: 0.625rem; top: 50%; transform: translateY(-50%); color: var(--zinc-500); display: flex; }
        .ws-input-clear:hover { color: #f87171; }

        .ws-input, .ws-select {
            width: 100%;
            background: var(--bg-subpanel);
            border: 1px solid var(--bd-panel);
            border-radius: var(--radius-md);
            padding: 0.5rem 0.75rem;
            font-size: 0.75rem;
            color: var(--zinc-100);
            outline: none;
            transition: border-color 0.15s;
        }
        .ws-input.has-icon { padding-left: 2rem; padding-right: 1.75rem; }
        .ws-input::placeholder { color: var(--zinc-500); }
        .ws-input:focus, .ws-select:focus { border-color: var(--accent-bd); }

        .ws-dropdown {
            position: absolute;
            z-index: 40;
            margin-top: 0.25rem;
            width: 100%;
            max-height: 18rem;
            overflow-y: auto;
            background: var(--bg-subpanel);
            border: 1px solid var(--bd-panel);
            border-radius: var(--radius-md);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.85);
        }
        .ws-dd-item {
            width: 100%;
            text-align: left;
            padding: 0.625rem 0.75rem;
            border-bottom: 1px solid var(--zinc-900);
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            color: var(--zinc-300);
            font-size: 0.75rem;
        }
        .ws-dd-item:last-child { border-bottom: 0; }
        .ws-dd-item[data-active="true"] { background: var(--dd-hover-bg); color: var(--dd-hover-fg); }
        .ws-dd-item[data-selected="true"] { background: var(--accent-soft); color: var(--accent-soft-fg); }

        .ws-callout {
            margin-top: 0.5rem;
            padding: 0.625rem 0.75rem;
            border-radius: var(--radius-md);
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            background: var(--c-bg, var(--bg-subpanel));
            border: 1px solid var(--c-bd, var(--bd-panel));
        }
        .ws-callout[data-tone="char"]  { --c-bg: rgba(69, 26, 3, 0.3);  --c-bd: rgba(180, 83, 9, 0.6); }
        .ws-callout[data-tone="stage"] { --c-bg: rgba(8, 47, 73, 0.25); --c-bd: rgba(7, 89, 133, 0.6); }
        .ws-callout[data-tone="grant"] { --c-bg: rgba(4, 47, 46, 0.3);  --c-bd: rgba(15, 118, 110, 0.7); margin-top: 0; }
        .ws-callout[data-tone="done"]  { --c-bg: rgba(66, 32, 6, 0.3);  --c-bd: rgba(202, 138, 4, 0.7); margin-top: 0; }
        .ws-trait-box {
            padding-top: 0.375rem;
            border-top: 1px solid rgba(146, 64, 14, 0.4);
            font-size: 0.6875rem;
            color: var(--zinc-300);
            line-height: 1.5;
        }
        .ws-divider-top { padding-top: 0.5rem; border-top: 1px solid rgba(39, 39, 42, 0.8); }

        /* ==========================================================================
           5. SEMANTIC PILLS & SYNERGY MATRIX CARDS
           ========================================================================== */
        .ws-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.125rem 0.5rem;
            border-radius: var(--radius-sm);
            background: var(--p-bg, var(--bg-subpanel));
            border: 1px solid var(--p-bd, var(--bd-panel));
            color: var(--p-fg, var(--zinc-300));
            font-size: 0.625rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            line-height: 1.4;
            flex-shrink: 0;
        }
        .ws-pill[data-tone="char"]     { --p-bg: var(--tone-char-bg);     --p-bd: var(--tone-char-bd);     --p-fg: var(--tone-char-fg); }
        .ws-pill[data-tone="selected"] { --p-bg: var(--tone-selected-bg); --p-bd: var(--tone-selected-bd); --p-fg: var(--tone-selected-fg); }
        .ws-pill[data-tone="stage"]    { --p-bg: var(--tone-stage-bg);    --p-bd: var(--tone-stage-bd);    --p-fg: var(--tone-stage-fg); }
        .ws-pill[data-tone="grant"]    { --p-bg: var(--tone-grant-bg);    --p-bd: var(--tone-grant-bd);    --p-fg: var(--tone-grant-fg); }
        .ws-pill[data-tone="synergy"]  { --p-bg: var(--tone-synergy-bg);  --p-bd: var(--tone-synergy-bd);  --p-fg: var(--tone-synergy-fg); }
        .ws-pill[data-tone="upgrade"]  { --p-bg: var(--tone-upgrade-bg);  --p-bd: var(--tone-upgrade-bd);  --p-fg: var(--tone-upgrade-fg); }
        .ws-pill[data-tone="done"]     { --p-bg: var(--tone-done-bg);     --p-bd: var(--tone-done-bd);     --p-fg: var(--tone-done-fg); }
        .ws-pill[data-tone="sealed"]   { --p-bg: var(--tone-sealed-bg);   --p-bd: var(--tone-sealed-bd);   --p-fg: var(--tone-sealed-fg); }
        .ws-pill[data-tone="muted"]    { --p-bg: var(--tone-muted-bg);    --p-bd: var(--tone-muted-bd);    --p-fg: var(--tone-muted-fg); }
        .ws-pill[data-tone="alt"]      { --p-bg: var(--tone-alt-bg);      --p-bd: var(--tone-alt-bd);      --p-fg: var(--tone-alt-fg); font-size: 9px; padding: 0 4px; }

        .ws-mono-pill {
            font-family: var(--font-mono);
            font-size: 0.6875rem;
            padding: 0.125rem 0.5rem;
            border-radius: var(--radius-sm);
            background: var(--bg-subpanel);
            border: 1px solid var(--bd-panel);
            color: var(--zinc-300);
        }
        .ws-mono-pill strong { color: #fcd34d; }

        .ws-matrix-card {
            width: 100%;
            text-align: left;
            padding: 0.5rem 0.75rem;
            border-radius: var(--radius-sm);
            background: var(--bg-subpanel);
            border: 1px solid var(--bd-panel);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            font-size: 0.75rem;
            transition: background-color 0.15s, border-color 0.15s;
        }
        .ws-matrix-card[data-state="ready"]     { background: rgba(6, 78, 59, 0.3); border-color: rgba(4, 120, 87, 0.7); }
        .ws-matrix-card[data-state="reliquary"] { background: rgba(66, 32, 6, 0.35); border-color: rgba(234, 179, 8, 0.8); }
        button.ws-matrix-card:hover:not(:disabled) { background: rgba(74, 4, 78, 0.25); border-color: rgba(192, 38, 211, 0.7); }

        /* ==========================================================================
           6. BIT BOX INSPECTOR, GRID, UNIFIED TILE & SINGLE-ATLAS SPRITE
           ========================================================================== */
        .ws-toolbar { display: flex; flex-direction: column; gap: 0.625rem; }
        @media (min-width: 640px) { .ws-toolbar { flex-direction: row; align-items: center; justify-content: space-between; } }

        .ws-inspector {
            background: var(--bg-subpanel);
            border: 1px solid var(--bd-panel);
            border-radius: var(--radius-md);
            padding: 0.625rem 0.875rem;
            min-height: 3.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }
        .ws-inspector-thumb {
            width: 2rem;
            height: 2rem;
            border-radius: var(--radius-sm);
            background: var(--zinc-900);
            border: 1px solid var(--zinc-700);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .ws-inspector-thumb .ws-sprite-icon { width: 1.5rem; height: 1.5rem; }

        .ws-bitbox {
            background: var(--box-bg);
            border: 2px solid var(--box-bd);
            box-shadow: 0 0 20px var(--box-glow);
            border-radius: var(--radius-lg);
            padding: 0.75rem;
        }
        .ws-grid { display: grid; grid-template-columns: repeat(var(--grid-cols, 8), minmax(0, 1fr)); gap: 0.5rem; }
        @media (min-width: 640px) { .ws-grid { gap: 0.625rem; } }

        .ws-tile {
            --t-bg: #170606;
            --t-bd: #ef4444;
            --t-bd-hover: #f87171;
            --t-inset: #450a0a;
            --t-glow: transparent;
            --t-bar: none;
            --t-bar-inset: 0.25rem;
            --t-bar-h: 42%;
            --t-tag-bg: transparent;
            --t-filter: brightness(0.45) saturate(0.75);

            aspect-ratio: 1 / 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.25rem;
            background: var(--t-bg);
            border: 2px solid var(--t-bd);
            box-shadow: inset 0 0 0 1px var(--t-inset), var(--t-glow);
            user-select: none;
            transition: border-color 0.15s;
        }
        @media (min-width: 640px) { .ws-tile { padding: 0.375rem; } }
        button.ws-tile:hover:not([data-full="true"]) { border-color: var(--t-bd-hover); }
        button.ws-tile[data-full="true"] { cursor: not-allowed; opacity: 0.85; }
        div.ws-tile { cursor: default; }

        .ws-tile::before {
            content: "";
            position: absolute;
            inset: auto var(--t-bar-inset) var(--t-bar-inset) var(--t-bar-inset);
            height: var(--t-bar-h);
            background: var(--t-bar);
            pointer-events: none;
            z-index: 0;
        }

        .ws-tile[data-brackets="true"]::after {
            content: "";
            position: absolute;
            inset: -2px;
            pointer-events: none;
            z-index: 15;
            background-repeat: no-repeat;
            background-image:
                    linear-gradient(var(--bracket-top), var(--bracket-top)),
                    linear-gradient(var(--bracket-top), var(--bracket-top)),
                    linear-gradient(var(--bracket-top), var(--bracket-top)),
                    linear-gradient(var(--bracket-top), var(--bracket-top)),
                    linear-gradient(var(--bracket-side), var(--bracket-side)),
                    linear-gradient(var(--bracket-side), var(--bracket-side)),
                    linear-gradient(var(--bracket-side), var(--bracket-side)),
                    linear-gradient(var(--bracket-side), var(--bracket-side));
            background-size: 10px 4px, 10px 4px, 10px 4px, 10px 4px, 4px 6px, 4px 6px, 4px 6px, 4px 6px;
            background-position:
                    top left, top right, bottom left, bottom right,
                    top 4px left, top 4px right, bottom 4px left, bottom 4px right;
        }

        .ws-tile[data-state="auto"] {
            --t-bg: #191916; --t-bd: #fbbf24; --t-bd-hover: #fcd34d; --t-inset: #78350f;
            --t-glow: 0 0 10px rgba(251, 191, 36, 0.25);
            --t-bar: linear-gradient(to bottom, #33220a 0 25%, #66410e 25% 50%, #d97706 50% 75%, #fde047 75% 100%);
            --t-tag-bg: #fbbf24; --t-filter: brightness(1.1);
        }
        .ws-tile[data-state="grant"] {
            --t-bg: #0c1d1c; --t-bd: #2dd4bf; --t-bd-hover: #5eead4; --t-inset: #115e59;
            --t-glow: 0 0 12px rgba(45, 212, 191, 0.3);
            --t-bar: linear-gradient(to bottom, #042f2e 0 33.3%, #0f766e 33.3% 66.6%, #2dd4bf 66.6% 100%);
            --t-tag-bg: #5eead4; --t-filter: brightness(1.1);
        }
        .ws-tile[data-state="selected"] {
            --t-bg: #161a16; --t-bd: #a3e635; --t-bd-hover: #bef264; --t-inset: #166534;
            --t-glow: 0 0 10px rgba(132, 204, 22, 0.25);
            --t-bar: linear-gradient(to bottom, #143322 0 25%, #1b5231 25% 50%, #52a832 50% 75%, #bef264 75% 100%);
            --t-tag-bg: #a3e635; --t-filter: brightness(1.1);
        }
        .ws-tile[data-state="stage"] {
            --t-bg: #101820; --t-bd: #38bdf8; --t-bd-hover: #7dd3fc; --t-inset: #334155;
            --t-glow: 0 0 10px rgba(56, 189, 248, 0.25);
            --t-bar: linear-gradient(to bottom, #0c2d48 0 33.3%, #0284c7 33.3% 66.6%, #7dd3fc 66.6% 100%);
            --t-bar-inset: 0.375rem; --t-bar-h: 38%;
            --t-tag-bg: #7dd3fc; --t-filter: brightness(1.1);
        }
        .ws-tile[data-state="synergy"] {
            --t-bg: #1e0c24; --t-bd: #e879f9; --t-bd-hover: #f0abfc; --t-inset: #86198f;
            --t-glow: 0 0 14px rgba(232, 121, 249, 0.45);
            --t-bar: linear-gradient(to bottom, #3b0764 0 33.3%, #86198f 33.3% 66.6%, #e879f9 66.6% 100%);
            --t-tag-bg: #e879f9; --t-filter: brightness(1.1) drop-shadow(0 0 4px rgba(232, 121, 249, 0.75));
            z-index: 10;
        }
        .ws-tile[data-state="synergy"]::before { animation: ws-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .ws-tile[data-state="job-done"],
        .ws-tile[data-state="auto-reliquary"] {
            --t-bg: #121f0e; --t-bd: #fde047; --t-inset: #15803d;
            --t-glow: 0 0 16px rgba(250, 204, 21, 0.5);
            --t-bar: linear-gradient(to bottom, rgba(5, 46, 22, 0.8) 0 25%, rgba(21, 128, 61, 0.8) 25% 50%, rgba(163, 230, 53, 0.9) 50% 75%, #fef08a 75% 100%);
            --t-bar-h: 48%; --t-tag-bg: #fde047;
            --t-filter: brightness(1.15) drop-shadow(0 0 6px rgba(250, 204, 21, 0.95));
            z-index: 10;
        }
        .ws-tile[data-state="upgrade-me"] {
            --t-bg: #231206; --t-bd: #fb923c; --t-inset: #9a3412;
            --t-glow: 0 0 14px rgba(251, 146, 60, 0.45);
            --t-bar: linear-gradient(to bottom, rgba(67, 20, 7, 0.8) 0 33.3%, rgba(194, 65, 12, 0.8) 33.3% 66.6%, rgba(251, 191, 36, 0.9) 66.6% 100%);
            --t-tag-bg: #fb923c; --t-filter: brightness(1.05) drop-shadow(0 0 4px rgba(251, 146, 60, 0.85));
            animation: ws-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            z-index: 10;
        }
        .ws-tile[data-state="disabled"] {
            --t-bg: #0e0c0d; --t-bd: rgba(39, 39, 42, 0.9); --t-inset: #18181b;
            --t-filter: brightness(0.35) grayscale(1);
            opacity: 0.65;
        }
        .ws-tile[data-evo-ready="true"]:not([data-state="job-done"]):not([data-state="auto-reliquary"]) {
            --t-filter: brightness(1.15) drop-shadow(0 0 4px rgba(250, 204, 21, 0.9));
        }

        .ws-tile-sprite {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: var(--t-filter);
            transition: filter 0.15s, transform 0.15s;
        }
        .ws-tile[data-state="sealed"]:hover .ws-tile-sprite { filter: brightness(0.75); }
        .ws-tile[data-state="job-done"] .ws-tile-sprite,
        .ws-tile[data-state="auto-reliquary"] .ws-tile-sprite { transform: scale(1.05); }

            position: absolute;
            top: -0.375rem;
            left: -0.375rem;
            z-index: 20;
            width: 1.5rem;
            height: 1.5rem;
            pointer-events: none;
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.85));

        }

            position: absolute;
            top: 2px;
            left: 2px;
            z-index: 20;
            width: 0.875rem;
            height: 0.875rem;
            background: rgba(24, 24, 27, 0.95);
            border: 1px solid var(--zinc-700);
            color: var(--zinc-500);
            display: flex;
            align-items: center;
            justify-content: center;
        }

           ========================================================================== */
        .ws-modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .ws-modal {
            width: 100%;
            max-width: 32rem;
            background: var(--bg-panel);
            border: 1px solid var(--bd-panel);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        @keyframes ws-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

        /**
         * Hydrates raw game data tuples into structured DATA objects.
         * Transforms tuple-based entries into objects with computed properties.
         * @returns {object} Hydrated DATA object keyed by universe
         */
        function hydrateGameData() {
            const data = {};
            for (const [uKey, raw] of Object.entries(RAW_GAME_DATA)) {
                const characters = raw.characters.map(({name, weapons, passive, flag}) => ({
                    name,
                    weapons: Array.isArray(weapons) ? weapons : [],
                    passive,
                    isAlt: flag === CONFIG.FLAG_TYPES.ALT,
                    grantType: flag && flag !== CONFIG.FLAG_TYPES.ALT ? flag : null
                }));
                const stages = raw.stages.map(({name, weapons, passives, note}) => ({ name, weapons, passives, note }));
                const weapons = raw.weapons.map(({name, passive, evolution, option}) => ({
                    name,
                    passive,
                    evolution,
                    hasEvoTile: option !== CONFIG.FLAG_TYPES.NO_TILE && option !== CONFIG.FLAG_TYPES.GRANT,
                    isSlotFreeGrant: option === CONFIG.FLAG_TYPES.GRANT,
                    secondEvolution: Array.isArray(option) ? { name: option[0], passive: option[1] } : null
                }));

                const weaponLookup = new Map();
                const allEvos = [];
                for (const w of weapons) {
                    weaponLookup.set(w.name, w);
                    if (w.evolution && w.evolution !== "Reliquary" && w.evolution !== "Artefacts of Power") {
                        if (!allEvos.includes(w.evolution)) allEvos.push(w.evolution);
                        weaponLookup.set(w.evolution, {
                            name: w.evolution,
                            passive: w.secondEvolution ? w.secondEvolution.passive : null,
                            evolution: w.secondEvolution ? w.secondEvolution.name : null,
                            isEvolvedStart: true
                        });
                    }
                    if (w.secondEvolution) {
                        if (!allEvos.includes(w.secondEvolution.name)) allEvos.push(w.secondEvolution.name);
                        weaponLookup.set(w.secondEvolution.name, {
                            name: w.secondEvolution.name,
                            passive: null,
                            evolution: null,
                            isEvolvedStart: true
                        });
                    }
                }

                data[uKey] = {
                    label: raw.label,
                    subtitle: raw.subtitle,
                    characters,
                    charMap: new Map(characters.map((c) => [c.name, c])),
                    stages,
                    stageMap: new Map(stages.map((s) => [s.name, s])),
                    weapons,
                    weaponLookup,
                    allEvos,
                    passives: raw.passives,
                    passiveSet: new Set(raw.passives)
                };
            }
            return data;
        }

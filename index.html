                if (saved && saved.startsWith("http")) return saved;
            } catch {}
            return isGoogleSites ? CONFIG.URLS.DEFAULT_SITES : `${location.origin}${location.pathname}`;
        };

        const emptyBuild = () => ({
            character: null,
            map: null,
            weapons: [],
            passives: [],
            freeGrantUnsealed: false,
            grantBaseWeapon: "",
            reliquaryEvoWeapon: ""
        });

        function encodeBuildHash(universe, build) {
            try {
                const payload = {
                    u: universe,
                    c: build.character || "",
                    m: build.map || "",
                    w: (build.weapons || []).map((w) => w.name),
                    p: build.passives || [],
                    fg: Boolean(build.freeGrantUnsealed),
                    gw: build.grantBaseWeapon || "",
                    rw: build.reliquaryEvoWeapon || ""
                };
                const bytes = new TextEncoder().encode(JSON.stringify(payload));
                let bin = "";
                bytes.forEach((b) => { bin += String.fromCharCode(b); });
                return `build=${btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "")}`;
            } catch {
                return "";
            }
        }

        function decodeBuildInput(raw) {
            try {
                if (!raw || typeof raw !== "string") return null;
                const trimmed = raw.trim();
                const idx = trimmed.indexOf("#");
                const frag = idx >= 0 ? trimmed.slice(idx + 1) : trimmed;
                const m = frag.match(/(?:^|&)build=([A-Za-z0-9\-_]+)/);
                if (!m) return null;

                let b64 = m[1].replace(/-/g, "+").replace(/_/g, "/");
                while (b64.length % 4) b64 += "=";
                const bin = atob(b64);
                const bytes = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const parsed = JSON.parse(new TextDecoder().decode(bytes));

                const universe = parsed.u === "aos" ? "aos" : "40k";
                const uData = DATA[universe];
                const charObj = uData.charMap.get(CONFIG.LEGACY_ALIASES[parsed.c] || parsed.c) || null;
                const stageObj = uData.stageMap.get(parsed.m) || null;
                const bonusW = new Set(stageObj ? stageObj.weapons : []);
                const bonusP = new Set(stageObj ? stageObj.passives : []);

                const weapons = [];
                const addWeapon = (wName, checkStage) => {
                    if (weapons.length >= CONFIG.SLOTS.MAX_WEAPONS || weapons.some((w) => w.name === wName)) return;
                    if (checkStage && bonusW.has(wName)) return;
                    const wObj = uData.weaponLookup.get(wName);
                    if (wObj && !wObj.isSlotFreeGrant) weapons.push(wObj);
                };
                (charObj ? charObj.weapons : []).forEach((w) => addWeapon(w, false));
                if (Array.isArray(parsed.w)) parsed.w.forEach((w) => addWeapon(w, true));

                const passives = [];
                if (Array.isArray(parsed.p)) {
                    for (const pName of parsed.p) {
                        if (passives.length < CONFIG.SLOTS.MAX_PASSIVES && !passives.includes(pName) && !bonusP.has(pName) && uData.passiveSet.has(pName)) {
                            passives.push(pName);
                        }
                    }
                }

                const validBase = typeof parsed.gw === "string" && uData.weapons.some((w) => !w.isSlotFreeGrant && w.name === parsed.gw) ? parsed.gw : "";
                const validEvo = typeof parsed.rw === "string" && uData.allEvos.includes(parsed.rw) ? parsed.rw : "";

                return {
                    universe,
                    build: {
                        character: charObj ? charObj.name : null,
                        map: stageObj ? stageObj.name : null,
                        weapons,
                        passives,
                        freeGrantUnsealed: Boolean(parsed.fg),
                        grantBaseWeapon: validBase,
                        reliquaryEvoWeapon: validEvo
                    }
                };
            } catch {
                return null;
            }
        }

        const initDecoded = decodeBuildInput(location.hash);
        const state = {
            universe: initDecoded ? initDecoded.universe : "40k",
            builds: {
                "40k": initDecoded && initDecoded.universe === "40k" ? initDecoded.build : emptyBuild(),
                "aos": initDecoded && initDecoded.universe === "aos" ? initDecoded.build : emptyBuild()
            },
            charQuery: initDecoded && initDecoded.build.character ? initDecoded.build.character : "",
            charOpen: false,
            charHighlight: 0,
            gridSearch: "",
            gridFilter: "all",
            inspected: null,
            publicSiteUrl: resolveInitialUrl(),
            shareOpen: false,
            copied: false,
            importText: "",
            importError: ""
        };

        const currentBuild = () => state.builds[state.universe];
        const updateBuild = (patch) => Object.assign(state.builds[state.universe], patch);

        /* ==========================================================================
           4. SYNERGY & UNIFIED TILE ENGINE
           ========================================================================== */

        /**
         * Computes the synergy matrix: ready pairs, missing passives, missing weapons.
         */
        function computeSynergyMatrix(activeWeapons, activeWeaponSet, activePassives, uData, hasReliquary, build, uskavarUnlocked) {
            const ready = [];
            const readyWeapons = new Set();
            const fullyEvolved = new Set();
            const missingPassive = [];
            const missingWeapon = [];

            if (hasReliquary && build.reliquaryEvoWeapon) {
                ready.push({ weapon: "Reliquary", passive: "Bypasses Prerequisites", evolution: build.reliquaryEvoWeapon, isBypass: true });
            }

            for (const w of activeWeapons) {
                const firstReady = !w.passive || activePassives.has(w.passive);
                if (firstReady) {
                    readyWeapons.add(w.name);
                    ready.push({ weapon: w.name, passive: w.passive || "Max Level / Pickup", evolution: w.evolution });
                } else {
                    missingPassive.push({ weapon: w.name, passive: w.passive, evolution: w.evolution });
                }

                if (w.secondEvolution && firstReady) {
                    if (activePassives.has(w.secondEvolution.passive)) {
                        fullyEvolved.add(w.name);
                        ready.push({ weapon: w.evolution, passive: w.secondEvolution.passive, evolution: w.secondEvolution.name });
                    } else {
                        missingPassive.push({ weapon: w.evolution, passive: w.secondEvolution.passive, evolution: w.secondEvolution.name });
                    }
                } else if (firstReady) {
                    fullyEvolved.add(w.name);
                }
            }

            for (const p of activePassives) {
                for (const w of uData.weapons) {
                    if (w.passive === p && !activeWeaponSet.has(w.name)) {
                        missingWeapon.push({ weapon: w.name, passive: p, evolution: w.evolution });
                    }
                }
            }

            return { ready, readyWeapons, fullyEvolved, missingPassive, missingWeapon };
        }

        /**
         * Builds weapon tiles from the universe data and current build state.
         */
        function buildWeaponTiles(uData, build, lockedSet, bonusW, readyWeapons, fullyEvolved, matchingWeapons, hasArcheotech, hasExotic, hasReliquary, grantType) {
            const tiles = [];

            for (const w of uData.weapons) {
                if (w.isSlotFreeGrant) {
                    const isAuto = (w.name === "Archeotech" && grantType === CONFIG.FLAG_TYPES.ARCHEOTECH) || (w.name === "Exotic Weaponry" && grantType === CONFIG.FLAG_TYPES.EXOTIC);
                    const isActive = isAuto || build.freeGrantUnsealed;
                    const status = isAuto ? CONFIG.TILE_STATES.AUTO : isActive ? CONFIG.TILE_STATES.GRANT : CONFIG.TILE_STATES.SEALED;
                    tiles.push({
                        kind: "base", id: `w:${w.name}`, name: w.name, state: status, status,
                        tag: isAuto ? "CHAR" : isActive ? "0 SLOT" : "",
                        waxSeal: !isActive, brackets: true, evoReady: isActive,
                        searchKeys: [w.name, w.evolution],
                        detail: `${w.name} — Grants 1 Weapon of Choice at start (uses 0 of ${CONFIG.SLOTS.MAX_WEAPONS} weapon slots)`
                    });
                    if (w.evolution === "Reliquary") {
                        const evoState = grantType === CONFIG.FLAG_TYPES.RELIQUARY ? CONFIG.TILE_STATES.AUTO_RELIQUARY : hasReliquary ? CONFIG.TILE_STATES.JOB_DONE : CONFIG.TILE_STATES.DISABLED;
                        tiles.push({
                            kind: "evolution", id: "e:Reliquary", name: "Reliquary", state: evoState, evoState,
                            tag: hasReliquary ? "0 SLOT ★" : "", tagPos: "top",
                            evoLock: !hasReliquary, brackets: hasReliquary, evoReady: hasReliquary,
                            searchKeys: ["Reliquary", "Archeotech"],
                            detail: hasReliquary
                                ? "ACTIVE (0 Slots) — Grants 1 Evolved Weapon of Choice bypassing prerequisites"
                                : "Unlocks automatically when Archeotech is unsealed (0 slots used)"
                        });
                    }
                    continue;
                }

                const isAuto = lockedSet.has(w.name);
                const isStage = bonusW.includes(w.name);
                const isGrant = build.grantBaseWeapon === w.name;
                const isSelected = !isAuto && ((build.weapons || []).some((bw) => bw.name === w.name) || isGrant);
                const status = isAuto ? CONFIG.TILE_STATES.AUTO : isStage ? CONFIG.TILE_STATES.STAGE : isGrant ? CONFIG.TILE_STATES.GRANT : isSelected ? CONFIG.TILE_STATES.SELECTED : CONFIG.TILE_STATES.SEALED;
                const isSealed = status === CONFIG.TILE_STATES.SEALED;
                const isEvoReady = !isSealed && readyWeapons.has(w.name);
                const isNeedsUpgrade = !isSealed && !fullyEvolved.has(w.name);
                const isSynergized = isSealed && matchingWeapons.has(w.name);
                const isFull = isSealed && (build.weapons || []).length >= CONFIG.SLOTS.MAX_WEAPONS;

                tiles.push({
                    kind: "base", id: `w:${w.name}`, name: w.name,
                    state: isSynergized ? CONFIG.TILE_STATES.SYNERGY : status, status,
                    tag: isSynergized ? "★" : status === CONFIG.TILE_STATES.AUTO ? "CHAR" : status === CONFIG.TILE_STATES.GRANT ? "FREE" : status === CONFIG.TILE_STATES.STAGE ? "STAGE" : status === CONFIG.TILE_STATES.SELECTED ? "✓" : "",
                    tagShape: (isSynergized || status === CONFIG.TILE_STATES.SELECTED) ? "square" : "",
                    waxSeal: isSealed, brackets: status !== CONFIG.TILE_STATES.STAGE,
                    evoReady: isEvoReady, needsUpgrade: isNeedsUpgrade, synergized: isSynergized, full: isFull,
                    searchKeys: [w.name, w.evolution, w.passive, w.secondEvolution?.name, w.secondEvolution?.passive],
                    detail: w.secondEvolution
                        ? `Pairs with ${w.passive} → ${w.evolution} (+ ${w.secondEvolution.passive} → ${w.secondEvolution.name})`
                        : w.passive ? `Pairs with ${w.passive} → ${w.evolution}` : w.evolution ? `Evolves into ${w.evolution}` : "Evolved Starting Weapon"
                });

                if (w.hasEvoTile && w.evolution) {
                    const evoCharLocked = lockedSet.has(w.evolution);
                    const relBypass = build.reliquaryEvoWeapon === w.evolution;
                    if (evoCharLocked) {
                        const evoStart = uData.weaponLookup.get(w.evolution);
                        const evoReady = !evoStart?.passive || readyWeapons.has(w.evolution);
                        tiles.push({
                            kind: "base", id: `w:${w.evolution}`, name: w.evolution,
                            state: CONFIG.TILE_STATES.AUTO, status: CONFIG.TILE_STATES.AUTO, tag: "CHAR", brackets: true,
                            evoReady, needsUpgrade: Boolean(evoStart?.passive) && !evoReady,
                            searchKeys: [w.evolution, evoStart?.passive, evoStart?.evolution],
                            detail: evoStart?.passive ? `Pairs with ${evoStart.passive} → ${evoStart.evolution}` : "Evolved Starting Weapon"
                        });
                    } else {
                        const evoState = relBypass ? CONFIG.TILE_STATES.JOB_DONE : isSealed ? CONFIG.TILE_STATES.DISABLED : isEvoReady ? CONFIG.TILE_STATES.JOB_DONE : CONFIG.TILE_STATES.UPGRADE_ME;
                        tiles.push({
                            kind: "evolution", id: `e:${w.evolution}`, name: w.evolution,
                            state: evoState, evoState, passiveName: w.passive,
                            tag: evoState === CONFIG.TILE_STATES.JOB_DONE ? "DONE ★" : evoState === CONFIG.TILE_STATES.UPGRADE_ME ? "! UPGRADE" : "",
                            tagPos: "top", evoLock: evoState === CONFIG.TILE_STATES.DISABLED, brackets: evoState !== CONFIG.TILE_STATES.DISABLED,
                            evoReady: evoState === CONFIG.TILE_STATES.JOB_DONE, needsUpgrade: evoState === CONFIG.TILE_STATES.UPGRADE_ME,
                            searchKeys: [w.evolution, w.name, w.passive],
                            detail: relBypass
                                ? "RELIQUARY BYPASS! Granted directly with 0 slots & 0 passive requirements"
                                : evoState === CONFIG.TILE_STATES.DISABLED
                                    ? `Evolution of ${w.name} (Sealed — unseal ${w.name} first)`
                                    : evoState === CONFIG.TILE_STATES.UPGRADE_ME
                                        ? `UPGRADE ME! Base ${w.name} is active — select ${w.passive} in Passives to evolve`
                                        : w.passive ? `JOB DONE! ${w.name} + ${w.passive} → ${w.evolution}` : `JOB DONE! ${w.name} → ${w.evolution}`
                        });
                    }
                }
            }

            return tiles;
        }

        /**
         * Builds passive tiles from the universe data and current build state.
         */
        function buildPassiveTiles(uData, build, bonusP, neededPassives, readyWeapons, fullyEvolved, uskavarUnlocked) {
            return uData.passives.map((pName) => {
                const status = bonusP.includes(pName) ? CONFIG.TILE_STATES.STAGE : (build.passives || []).includes(pName) ? CONFIG.TILE_STATES.SELECTED : CONFIG.TILE_STATES.SEALED;
                const isSealed = status === CONFIG.TILE_STATES.SEALED;
                const neededBy = neededPassives.get(pName) || [];
                const isSynergized = isSealed && neededBy.length > 0;
                const isFull = isSealed && (build.passives || []).length >= CONFIG.SLOTS.MAX_PASSIVES;
                const directW = uData.weapons.filter((w) => w.passive === pName);
                const secondW = uData.weapons.filter((w) => w.secondEvolution?.passive === pName);
                const targets = [
                    ...directW.map((w) => `${w.name} → ${w.evolution}`),
                    ...secondW.map((w) => `${w.evolution} → ${w.secondEvolution.name}`)
                ];
                const pairedReady = !isSealed && (
                    directW.some((w) => readyWeapons.has(w.name)) ||
                    (uskavarUnlocked && secondW.some((w) => fullyEvolved.has(w.name) || readyWeapons.has(w.evolution)))
                );

                return {
                    kind: "passive", id: `p:${pName}`, name: pName,
                    state: isSynergized ? CONFIG.TILE_STATES.SYNERGY : status, status,
                    tag: isSynergized ? "★" : status === CONFIG.TILE_STATES.STAGE ? "STAGE" : status === CONFIG.TILE_STATES.SELECTED ? "✓" : "",
                    tagShape: (isSynergized || status === CONFIG.TILE_STATES.SELECTED) ? "square" : "",
                    waxSeal: isSealed, brackets: status !== CONFIG.TILE_STATES.STAGE,
                    evoReady: pairedReady, synergized: isSynergized, full: isFull,
                    searchKeys: [pName, ...directW.flatMap((w) => [w.name, w.evolution]), ...secondW.flatMap((w) => [w.name, w.evolution, w.secondEvolution.name])],
                    detail: targets.length ? `Evolves: ${targets.join(", ")}` : "Utility Passive"
                };
            });
        }

        /**
         * Main orchestrator: computes all derived state from the current build.
         */
        function computeDerived() {
            const u = state.universe;
            const uData = DATA[u];
            const build = currentBuild();
            const charObj = uData.charMap.get(build.character) || null;
            const stageObj = uData.stageMap.get(build.map) || null;
            const lockedSet = new Set(charObj ? charObj.weapons : []);
            const bonusW = stageObj ? stageObj.weapons : [];
            const bonusP = stageObj ? stageObj.passives : [];

            const grantType = charObj ? charObj.grantType : null;
            const hasArcheotech = u === "40k" && (grantType === CONFIG.FLAG_TYPES.ARCHEOTECH || build.freeGrantUnsealed);
            const hasReliquary = u === "40k" && (grantType === CONFIG.FLAG_TYPES.RELIQUARY || hasArcheotech);
            const hasExotic = u === "aos" && (grantType === CONFIG.FLAG_TYPES.EXOTIC || build.freeGrantUnsealed);
            const grantBaseObj = (hasArcheotech || hasExotic) && build.grantBaseWeapon ? uData.weaponLookup.get(build.grantBaseWeapon) : null;

            const activeWeapons = [...(build.weapons || [])];
            if (grantBaseObj && !activeWeapons.some((w) => w.name === grantBaseObj.name)) activeWeapons.push(grantBaseObj);
            for (const wName of bonusW) {
                if (!activeWeapons.some((w) => w.name === wName)) {
                    const wObj = uData.weaponLookup.get(wName);
                    if (wObj) activeWeapons.push(wObj);
                }
            }
            const activeWeaponSet = new Set(activeWeapons.map((w) => w.name));
            const activePassives = new Set([...(build.passives || []), ...bonusP]);

            const uskavarUnlocked = u === "aos" && (
                activeWeaponSet.has("Uskavar the Sunderer") ||
                (activeWeaponSet.has("Stormcharged Warhammer") && activePassives.has("Tactical Rock"))
            );

            // Compute synergy matrix
            const { ready, readyWeapons, fullyEvolved, missingPassive, missingWeapon } = computeSynergyMatrix(
                activeWeapons, activeWeaponSet, activePassives, uData, hasReliquary, build, uskavarUnlocked
            );

            // Compute needed passives map
            const neededPassives = new Map();
            for (const w of activeWeapons) {
                if (w.passive) {
                    if (!neededPassives.has(w.passive)) neededPassives.set(w.passive, []);
                    neededPassives.get(w.passive).push(w.name);
                }
                if (w.secondEvolution && w.secondEvolution.passive && uskavarUnlocked) {
                    const sp = w.secondEvolution.passive;
                    if (!neededPassives.has(sp)) neededPassives.set(sp, []);
                    neededPassives.get(sp).push(`${w.evolution} (${w.name})`);
                }
            }
            const matchingWeapons = new Set(uData.weapons.filter((w) => w.passive && activePassives.has(w.passive)).map((w) => w.name));

            // Build tiles
            const rawWeaponTiles = buildWeaponTiles(uData, build, lockedSet, bonusW, readyWeapons, fullyEvolved, matchingWeapons, hasArcheotech, hasExotic, hasReliquary, grantType);
            const rawPassiveTiles = buildPassiveTiles(uData, build, bonusP, neededPassives, readyWeapons, fullyEvolved, uskavarUnlocked);

            // Apply search/filter and coordinates
            const applyCoordsAndFilter = (tiles) => {
                const q = state.gridSearch.trim().toLowerCase();
                return tiles
                    .map((t, i) => ({ ...t, row: Math.floor(i / CONFIG.GRID.COLUMNS) + 1, col: (i % CONFIG.GRID.COLUMNS) + 1 }))
                    .filter((t) => {
                        if (q && !t.searchKeys.some((k) => k && k.toLowerCase().includes(q))) return false;
                        if (state.gridFilter === "synergy") return t.synergized || t.evoReady || t.needsUpgrade;
                        if (state.gridFilter === "unsealed") return !t.waxSeal && !t.evoLock;
                        if (state.gridFilter === "sealed") return Boolean(t.waxSeal || t.evoLock);
                        return true;
                    });
            };

            const synergyPickCount =
                rawWeaponTiles.filter((t) => t.kind === "base" && t.synergized).length +
                rawPassiveTiles.filter((t) => t.synergized).length;

            return {
                uData, build, charObj, stageObj, lockedSet, bonusW, bonusP,
                hasArcheotech, hasReliquary, hasExotic,
                ready, missingPassive, missingWeapon,
                weaponTiles: applyCoordsAndFilter(rawWeaponTiles),
                passiveTiles: applyCoordsAndFilter(rawPassiveTiles),
                synergyPickCount
            };
        }

        /* ==========================================================================
           5. MUTATIONS & ACTIONS
           ========================================================================== */
        function selectCharacter(charName) {
            const uData = DATA[state.universe];
            const build = currentBuild();
            const oldChar = uData.charMap.get(build.character);
            const oldLocked = new Set(oldChar ? oldChar.weapons : []);
            const nextChar = uData.charMap.get(charName) || null;

            if (!nextChar) {
                updateBuild({
                    character: null,
                    weapons: (build.weapons || []).filter((w) => !oldLocked.has(w.name)),
                    grantBaseWeapon: build.freeGrantUnsealed ? build.grantBaseWeapon : "",
                    reliquaryEvoWeapon: build.freeGrantUnsealed ? build.reliquaryEvoWeapon : ""
                });
                state.charQuery = "";
                state.charOpen = false;
                return;
            }

            const newLockedObjs = nextChar.weapons.map((w) => uData.weaponLookup.get(w)).filter((w) => w && !w.isSlotFreeGrant);
            const newLockedSet = new Set(newLockedObjs.map((w) => w.name));
            let kept = (build.weapons || []).filter((w) => !oldLocked.has(w.name) && !newLockedSet.has(w.name));
            const maxExtra = Math.max(0, CONFIG.SLOTS.MAX_WEAPONS - newLockedObjs.length);
            if (kept.length > maxExtra) kept = kept.slice(0, maxExtra);

            const willHaveGrant = nextChar.grantType === CONFIG.FLAG_TYPES.ARCHEOTECH || nextChar.grantType === CONFIG.FLAG_TYPES.EXOTIC || build.freeGrantUnsealed;
            const willHaveRel = nextChar.grantType === CONFIG.FLAG_TYPES.RELIQUARY || nextChar.grantType === CONFIG.FLAG_TYPES.ARCHEOTECH || (state.universe === "40k" && build.freeGrantUnsealed);

            updateBuild({
                character: nextChar.name,
                weapons: [...newLockedObjs, ...kept],
                grantBaseWeapon: willHaveGrant ? build.grantBaseWeapon : "",
                reliquaryEvoWeapon: willHaveRel ? build.reliquaryEvoWeapon : ""
            });
            state.charQuery = nextChar.name;
            state.charOpen = false;
        }

        function selectMap(mapName) {
            if (!mapName) return updateBuild({ map: null });
            const uData = DATA[state.universe];
            const build = currentBuild();
            const charObj = uData.charMap.get(build.character);
            const lockedSet = new Set(charObj ? charObj.weapons : []);
            const stage = uData.stageMap.get(mapName);
            const bonusW = stage ? stage.weapons : [];
            const bonusP = stage ? stage.passives : [];
            updateBuild({
                map: mapName,
                weapons: (build.weapons || []).filter((w) => lockedSet.has(w.name) || !bonusW.includes(w.name)),
                passives: (build.passives || []).filter((p) => !bonusP.includes(p))
            });
        }

        function toggleWeapon(wName) {
            const uData = DATA[state.universe];
            const build = currentBuild();
            const wObj = uData.weaponLookup.get(wName);
            if (!wObj) return;

            if (wObj.isSlotFreeGrant) {
                const charObj = uData.charMap.get(build.character);
                if (charObj && (charObj.grantType === CONFIG.FLAG_TYPES.ARCHEOTECH || charObj.grantType === CONFIG.FLAG_TYPES.EXOTIC)) return;
                const next = !build.freeGrantUnsealed;
                updateBuild({
                    freeGrantUnsealed: next,
                    grantBaseWeapon: next ? build.grantBaseWeapon : "",
                    reliquaryEvoWeapon: next ? build.reliquaryEvoWeapon : ""
                });
                return;
            }

            const charObj = uData.charMap.get(build.character);
            const stageObj = uData.stageMap.get(build.map);
            if (charObj?.weapons.includes(wName) || stageObj?.weapons.includes(wName)) return;

            const exists = (build.weapons || []).some((w) => w.name === wName);
            if (exists) {
                updateBuild({ weapons: (build.weapons || []).filter((w) => w.name !== wName) });
            } else if ((build.weapons || []).length < CONFIG.SLOTS.MAX_WEAPONS) {
                updateBuild({ weapons: [...(build.weapons || []), wObj] });
            }
        }

        function togglePassive(pName) {
            const uData = DATA[state.universe];
            const build = currentBuild();
            const stageObj = uData.stageMap.get(build.map);
            if (!pName || stageObj?.passives.includes(pName)) return;

            if ((build.passives || []).includes(pName)) {
                updateBuild({ passives: (build.passives || []).filter((p) => p !== pName) });
            } else if ((build.passives || []).length < CONFIG.SLOTS.MAX_PASSIVES) {
                updateBuild({ passives: [...(build.passives || []), pName] });
            }
        }

        async function copyShareUrl(url) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(url);
                    return true;
                }
            } catch {}
            try {
                const ta = document.createElement("textarea");
                ta.value = url;
                ta.style.cssText = "position:fixed;left:-9999px";
                document.body.appendChild(ta);
                ta.select();
                document.execCommand("copy");
                ta.remove();
                return true;
            } catch {
                return false;
            }
        }

        /* ==========================================================================
           6. UNIFIED RENDERING & DELEGATED DOM BINDING
           ========================================================================== */
        const appEl = document.getElementById("app");
        let tileIndex = new Map();
        let lastUniverseRendered = null;

        function getFilteredChars() {
            const uData = DATA[state.universe];
            const q = state.charQuery.trim().toLowerCase();
            const sel = currentBuild().character;
            if (!q || (sel && q === sel.toLowerCase())) return uData.characters;
            return uData.characters.filter((c) =>
                c.name.toLowerCase().includes(q) ||
                (c.weapons && c.weapons.some((w) => w.toLowerCase().includes(q))) ||
                (c.passive && c.passive.toLowerCase().includes(q)) ||
                (c.grantType && c.grantType.toLowerCase().includes(q))
            );
        }

        function renderTile(t) {
            const isEvo = t.kind === "evolution";
            const tagEl = isEvo ? "div" : "button";
            const actionAttr = isEvo ? `aria-disabled="true"` : `type="button" data-action="${t.kind === "passive" ? "toggle-passive" : "toggle-weapon"}" data-name="${esc(t.name)}"`;
            const tagHtml = t.tag
                ? `<span class="ws-tile-tag"${t.tagPos ? ` data-pos="${t.tagPos}"` : ""}${t.tagShape ? ` data-shape="${t.tagShape}"` : ""}>${t.tag === "✓" ? svg("check", 10, 3.5) : esc(t.tag)}</span>`
                : "";

            return `<${tagEl} class="ws-tile" data-tile-id="${esc(t.id)}" data-state="${t.state}" data-brackets="${t.brackets ? "true" : "false"}"${t.evoReady ? ` data-evo-ready="true"` : ""}${t.full ? ` data-full="true"` : ""} ${actionAttr} title="${esc(`${t.name} (R${t.row}:C${t.col}) — ${t.detail}`)}">` +
                (t.waxSeal ? WAX_SEAL_SVG : "") +
                `<div class="ws-tile-sprite">${spriteHtml(t.name)}</div>` +
                (t.evoLock ? `<span class="ws-evo-lock">${svg("lock", 10)}</span>` : "") +
                tagHtml +
                `</${tagEl}>`;
        }

        function renderInspector(item) {
            if (!item) {
                return `<p class="ws-meta" style="margin:0">Click base weapons &amp; passives to toggle your <strong style="color:#34d399">${CONFIG.SLOTS.MAX_WEAPONS}+${CONFIG.SLOTS.MAX_PASSIVES} slots</strong>. <strong style="color:#5eead4">Archeotech</strong>, <strong style="color:#fde047">Reliquary</strong> &amp; <strong style="color:#5eead4">Exotic Weaponry</strong> use <strong style="color:var(--zinc-200)">0 slots</strong>.</p>`;
            }
            const statusBadge = item.kind === "evolution"
                ? ({
                    [CONFIG.TILE_STATES.AUTO_RELIQUARY]: ["done", "Reliquary (0 Slots • Bypasses Req)"],
                    [CONFIG.TILE_STATES.JOB_DONE]: ["done", "Job Done — Evolution Ready"],
                    [CONFIG.TILE_STATES.UPGRADE_ME]: ["upgrade", `Upgrade Me — Equip ${item.passiveName || "Passive"}`],
                    [CONFIG.TILE_STATES.DISABLED]: ["muted", "Disabled (Base Sealed)"]
                }[item.evoState] || ["muted", "Disabled"])
                : ({
                    [CONFIG.TILE_STATES.AUTO]: ["char", "Locked by Character"],
                    [CONFIG.TILE_STATES.GRANT]: ["grant", "Free Grant (0 Slots Used)"],
                    [CONFIG.TILE_STATES.SELECTED]: ["selected", "Manually Selected"],
                    [CONFIG.TILE_STATES.STAGE]: ["stage", "Stage Implied"],
                    [CONFIG.TILE_STATES.SEALED]: ["sealed", "Sealed in Game"]
                }[item.status] || ["sealed", "Sealed"]);

            return `<div class="ws-row ws-min-0" style="gap:0.75rem">` +
                `<div class="ws-inspector-thumb">${spriteHtml(item.name)}</div>` +
                `<div class="ws-min-0">` +
                `<div class="ws-row"><span class="ws-truncate" style="font-size:12px;font-weight:700;color:var(--zinc-100)">${esc(item.name)}</span><span class="ws-mono" style="font-size:10px;color:var(--zinc-500)">R${item.row}:C${item.col}</span></div>` +
                `<div class="ws-truncate ws-meta">${esc(item.detail)}</div>` +
                `</div>` +
                `</div>` +
                `<div class="ws-row-sm ws-shrink-0">` +
                (item.kind !== "evolution" && item.evoReady ? `<span class="ws-pill" data-tone="done">Job Done ★</span>` : "") +
                (item.kind !== "evolution" && item.needsUpgrade ? `<span class="ws-pill" data-tone="upgrade">Upgrade Me</span>` : "") +
                (item.synergized ? `<span class="ws-pill" data-tone="synergy">★ Synergy Pick</span>` : "") +
                `<span class="ws-pill" data-tone="${statusBadge[0]}">${esc(statusBadge[1])}</span>` +
                `</div>`;
        }

        function mountShell() {
            appEl.innerHTML = `
                    <header class="ws-header">
                        <div class="ws-container ws-header-inner">
                            <div class="ws-row" style="gap:0.75rem">
                                <div class="ws-emblem">${svg("shield", 20)}</div>
                                <div>
                                    <h1 class="ws-title">Warhammer Survivors <span>Bit Box Planner</span></h1>
                                    <p id="ws-subtitle" class="ws-subtitle"></p>
                                </div>
                            </div>
                            <div class="ws-row-wrap" style="gap:0.5rem">
                                <div class="ws-segmented">
                                    <button type="button" class="ws-seg-btn" data-action="switch-universe" data-val="40k" aria-pressed="true">40,000</button>
                                    <button type="button" class="ws-seg-btn" data-action="switch-universe" data-val="aos" aria-pressed="false">Age of Sigmar</button>
                                </div>
                                <button type="button" class="ws-btn" data-variant="share" data-action="open-share">${svg("share", 14)}<span>Share / Load</span></button>
                                <button type="button" class="ws-btn" data-action="reset-build" title="Reset current universe build">${svg("reset", 14)}<span class="ws-hide-mobile">Reset</span></button>
                            </div>
                        </div>
                    </header>

                    <main class="ws-container ws-layout">
                        <div class="ws-col-left ws-stack">
                            <section class="ws-panel">
                                <div class="ws-panel-head">
                                    <h2 class="ws-heading">${svg("compass", 16)}<span>Mission Deployment</span></h2>
                                    <span id="ws-universe-label" class="ws-mono ws-meta"></span>
                                </div>

                                <div id="ws-char-box" class="ws-rel">
                                    <label class="ws-label" for="ws-char-input">Survivor / Champion (Locks Starting Weapon)</label>
                                    <div class="ws-rel">
                                        <span class="ws-input-icon">${svg("search", 14)}</span>
                                        <input id="ws-char-input" type="text" class="ws-input has-icon" placeholder="Type character, starting weapon, or trait..." autocomplete="off" />
                                        <button id="ws-char-clear" type="button" class="ws-input-clear" data-action="clear-char" title="Clear character" hidden>${svg("x", 14)}</button>
                                    </div>
                                    <div id="ws-char-dropdown" class="ws-dropdown" hidden></div>
                                    <div id="ws-char-callout"></div>
                                </div>

                                <div id="ws-grants-box" class="ws-divider-top ws-stack-md" hidden></div>

                                <div class="ws-divider-top">
                                    <label class="ws-label" for="ws-stage-select">Stage / Mission Map (Grants Free Ground Pickups)</label>
                                    <select id="ws-stage-select" class="ws-select"></select>
                                    <div id="ws-stage-callout"></div>
                                </div>
                            </section>

                            <section id="ws-matrix" class="ws-panel"></section>
                        </div>

                        <div class="ws-col-right">
                            <section class="ws-panel" style="gap:1.25rem">
                                <div class="ws-stack-md" style="padding-bottom:1rem;border-bottom:1px solid var(--bd-divider)">
                                    <div class="ws-between" style="flex-wrap:wrap;gap:0.5rem">
                                        <h2 class="ws-heading"><span>Bit Box</span><span class="ws-mono-pill" style="font-size:10px;color:var(--zinc-400)">${CONFIG.GRID.COLUMNS} Per Row</span></h2>
                                        <div class="ws-row-wrap">
                                            <span class="ws-pill" data-tone="char">Char</span>
                                            <span class="ws-pill" data-tone="selected">${svg("check", 10, 3)}Selected</span>
                                            <span class="ws-pill" data-tone="stage">Stage</span>
                                            <span class="ws-pill" data-tone="grant">Free Pick</span>
                                            <span class="ws-pill" data-tone="synergy">★ Synergy</span>
                                            <span class="ws-pill" data-tone="upgrade">! Upgrade</span>
                                            <span class="ws-pill" data-tone="done">Done ★</span>
                                            <span class="ws-pill" data-tone="sealed">${svg("x", 10, 3)}Sealed</span>
                                        </div>
                                    </div>

                                    <div class="ws-toolbar">
                                        <div class="ws-rel ws-flex-1">
                                            <span class="ws-input-icon">${svg("search", 14)}</span>
                                            <input id="ws-grid-search" type="text" class="ws-input has-icon" placeholder="Filter weapons, evolutions, or passives..." />
                                            <button id="ws-search-clear" type="button" class="ws-input-clear" data-action="clear-search" title="Clear search" hidden>${svg("x", 14)}</button>
                                        </div>
                                        <div id="ws-filter-tabs" class="ws-segmented" style="align-self:flex-start"></div>
                                    </div>

                                    <div id="ws-inspector" class="ws-inspector"></div>
                                </div>

                                <div>
                                    <div class="ws-between" style="margin-bottom:0.625rem">
                                        <h3 class="ws-sub-heading">${svg("crosshair", 14)}<span>Weapons</span></h3>
                                        <div id="ws-weapons-meta" class="ws-row"></div>
                                    </div>
                                    <div id="ws-weapons-grid" class="ws-bitbox"></div>
                                </div>

                                <div>
                                    <div class="ws-between" style="margin-bottom:0.625rem">
                                        <h3 class="ws-sub-heading">${svg("hexagon", 14)}<span>Passives</span></h3>
                                        <div id="ws-passives-meta" class="ws-row"></div>
                                    </div>
                                    <div id="ws-passives-grid" class="ws-bitbox"></div>
                                </div>
                            </section>
                        </div>
                    </main>

                    <div id="ws-modal" class="ws-modal-backdrop" hidden></div>
                `;
        }

        function render() {
            const d = computeDerived();
            const { uData, build, charObj, stageObj } = d;

            appEl.dataset.universe = state.universe;
            appEl.style.setProperty("--grid-cols", CONFIG.GRID.COLUMNS);
            document.getElementById("ws-subtitle").textContent = uData.subtitle;
            document.getElementById("ws-universe-label").textContent = uData.label;

            appEl.querySelectorAll('[data-action="switch-universe"]').forEach((btn) => {
                btn.setAttribute("aria-pressed", String(btn.dataset.val === state.universe));
            });

            const hash = encodeBuildHash(state.universe, build);
            if (hash) {
                try { history.replaceState(null, "", `#${hash}`); } catch {}
            }

            const charInput = document.getElementById("ws-char-input");
            if (document.activeElement !== charInput) charInput.value = state.charQuery;
            document.getElementById("ws-char-clear").hidden = !(state.charQuery || build.character);

            const ddEl = document.getElementById("ws-char-dropdown");
            ddEl.hidden = !state.charOpen;
            if (state.charOpen) {
                const list = getFilteredChars();
                ddEl.innerHTML = list.length === 0
                    ? `<div class="ws-meta" style="padding:0.625rem 0.75rem;font-style:italic">No survivors match "${esc(state.charQuery)}"</div>`
                    : list.map((c, idx) => {
                        const rightTag = (c.weapons && c.weapons.length)
                            ? `${svg("lock", 10)}${esc(c.weapons.join(" + "))}`
                            : `<span style="color:${c.grantType === CONFIG.FLAG_TYPES.RELIQUARY ? "#fde047" : "#5eead4"}">${c.grantType === CONFIG.FLAG_TYPES.ARCHEOTECH ? "Archeotech (Free Choice)" : c.grantType === CONFIG.FLAG_TYPES.RELIQUARY ? "Reliquary (Free Evo)" : "Exotic Weaponry (Free Choice)"}</span>`;
                        return `<button type="button" class="ws-dd-item" data-action="select-char" data-name="${esc(c.name)}" data-idx="${idx}" data-selected="${c.name === build.character}" data-active="${idx === state.charHighlight}">` +
                            `<div class="ws-between"><div class="ws-row-sm ws-min-0"><span class="ws-truncate" style="font-weight:${c.name === build.character ? 700 : 600}">${esc(c.name)}</span>${c.isAlt ? `<span class="ws-pill" data-tone="alt">Alt Skin</span>` : ""}</div><span class="ws-mono ws-row-sm ws-shrink-0" style="font-size:11px;color:#fbbf24">${rightTag}</span></div>` +
                            (c.passive ? `<p class="ws-meta" style="margin:0;line-height:1.35">${esc(c.passive)}</p>` : "") +
                            `</button>`;
                    }).join("");
            }

            const charCallout = document.getElementById("ws-char-callout");
            charCallout.innerHTML = charObj ? `<div class="ws-callout" data-tone="char">` +
                `<div class="ws-between" style="flex-wrap:wrap;gap:0.5rem">` +
                (charObj && charObj.weapons && charObj.weapons.length
                    ? `<span class="ws-row-sm" style="color:rgba(253,230,138,0.9)">${svg("lock", 14)}<span>Locked ${charObj.weapons.length > 1 ? "Weapons" : "Weapon"}:</span></span><div class="ws-row-wrap">${charObj.weapons.map((w) => `<span class="ws-pill" data-tone="char">${esc(w)}</span>`).join("")}</div>`
                    : `<span class="ws-row-sm" style="color:#5eead4">${svg("wand", 14)}<span>${charObj.grantType === CONFIG.FLAG_TYPES.ARCHEOTECH ? "Starts with Archeotech + Reliquary (0 Weapon Slots Used)" : charObj.grantType === CONFIG.FLAG_TYPES.RELIQUARY ? "Starts with Reliquary (Free Evolved Weapon • 0 Slots Used)" : "Starts with Exotic Weaponry (Free Weapon Choice • 0 Slots Used)"}</span></span>`) +
                `</div>` +
                (charObj.passive ? `<div class="ws-trait-box"><strong style="text-transform:uppercase;font-size:10px;letter-spacing:0.05em;color:#fbbf24;margin-right:0.375rem">Trait:</strong>${esc(charObj.passive)}</div>` : "") +
                `</div>` : "";

            const grantsBox = document.getElementById("ws-grants-box");
            const hasAnyGrant = d.hasArcheotech || d.hasExotic || d.hasReliquary;
            grantsBox.hidden = !hasAnyGrant;
            if (hasAnyGrant) {
                const baseOpts = uData.weapons.filter((w) => !w.isSlotFreeGrant).map((w) =>
                    `<option value="${esc(w.name)}"${build.grantBaseWeapon === w.name ? " selected" : ""}>${esc(w.name + (w.passive ? ` (Pairs with ${w.passive} → ${w.evolution})` : ""))}</option>`
                ).join("");
                const evoOpts = uData.allEvos.map((e) =>
                    `<option value="${esc(e)}"${build.reliquaryEvoWeapon === e ? " selected" : ""}>${esc(e)}</option>`
                ).join("");

                grantsBox.innerHTML =
                    ((d.hasArcheotech || d.hasExotic) ? `<div class="ws-callout" data-tone="grant">` +
                        `<div class="ws-between"><span class="ws-section-label" style="color:#5eead4">${svg("wand", 14)}<span>${d.hasArcheotech ? "Archeotech — Weapon of Choice (Free Slot)" : "Exotic Weaponry — Weapon of Choice (Free Slot)"}</span></span><span class="ws-pill" data-tone="grant">0 / 6 Slots</span></div>` +
                        `<select id="ws-grant-base" class="ws-select"><option value="">-- Choose Any Starting Base Weapon --</option>${baseOpts}</select>` +
                        `</div>` : "") +
                    (d.hasReliquary ? `<div class="ws-callout" data-tone="done">` +
                        `<div class="ws-between"><span class="ws-section-label" style="color:#fde047">${svg("key", 14)}<span>Reliquary — Evolved Weapon (Bypasses Req)</span></span><span class="ws-pill" data-tone="done">Free Evo</span></div>` +
                        `<select id="ws-reliquary-evo" class="ws-select"><option value="">-- Choose Any Evolved Weapon Directly --</option>${evoOpts}</select>` +
                        `</div>` : "");
            }

            const stageSel = document.getElementById("ws-stage-select");
            if (lastUniverseRendered !== state.universe) {
                stageSel.innerHTML = `<option value="">-- Select Stage (Optional) --</option>` + uData.stages.map((s) =>
                    `<option value="${esc(s.name)}">${esc(s.name + (s.weapons.length || s.passives.length ? ` (+${s.weapons.length}W / +${s.passives.length}P)` : " (No Ground Items)"))}</option>`
                ).join("");
                lastUniverseRendered = state.universe;
            }
            stageSel.value = build.map || "";

            document.getElementById("ws-stage-callout").innerHTML = stageObj ? `<div class="ws-callout" data-tone="stage">` +
                (stageObj.weapons.length ? `<div class="ws-row-wrap"><span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#7dd3fc;margin-right:0.25rem">Free Weapons:</span>${stageObj.weapons.map((w) => `<span class="ws-pill" data-tone="stage">${esc(w)}</span>`).join("")}</div>` : "") +
                (stageObj.passives.length ? `<div class="ws-row-wrap"><span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:#7dd3fc;margin-right:0.25rem">Free Passives:</span>${stageObj.passives.map((p) => `<span class="ws-pill" data-tone="stage">${esc(p)}</span>`).join("")}</div>` : "") +
                (stageObj.note ? `<p class="ws-meta" style="margin:0;line-height:1.35">${esc(stageObj.note)}</p>` : "") +
                `</div>` : "";

            document.getElementById("ws-matrix").innerHTML =
                `<div class="ws-panel-head"><h2 class="ws-heading">${svg("sparkles", 16)}<span>Synergy Matrix</span></h2><span class="ws-mono" style="font-size:11px;color:#34d399">${d.ready.length} Ready</span></div>` +
                `<div class="ws-stack-sm">` +
                `<div class="ws-section-label" style="color:#34d399">${svg("award", 14)}<span>Complete Evolution Pairs (${d.ready.length})</span></div>` +
                (d.ready.length === 0
                    ? `<p class="ws-empty">No completed evolution pairs yet. Equip matching weapons and passives on the Bit Box grid.</p>`
                    : `<div class="ws-stack-xs">${d.ready.map((r) => `<div class="ws-matrix-card" data-state="${r.isBypass ? "reliquary" : "ready"}"><div class="ws-min-0"><div class="ws-truncate" style="font-weight:700;color:${r.isBypass ? "#fde047" : "#6ee7b7"}">${esc(r.evolution)}</div><div class="ws-truncate ws-meta">${esc(`${r.weapon} + ${r.passive}`)}</div></div><span class="ws-pill" data-tone="${r.isBypass ? "done" : "selected"}">${r.isBypass ? "RELIQUARY" : "READY"}</span></div>`).join("")}</div>`) +
                `</div>` +
                (d.missingPassive.length ? `<div class="ws-divider-top ws-stack-sm">` +
                    `<div class="ws-section-label" style="color:#fbbf24">${svg("flame", 14)}<span>Missing Passives for Active Weapons (${d.missingPassive.length})</span></div>` +
                    `<div class="ws-stack-xs">${d.missingPassive.map((m) => `<button type="button" class="ws-matrix-card" data-action="toggle-passive" data-name="${esc(m.passive)}"${(build.passives || []).length >= CONFIG.SLOTS.MAX_PASSIVES ? " disabled" : ""}><div class="ws-min-0"><div class="ws-truncate" style="font-weight:600">Need <strong style="color:#e879f9">${esc(m.passive)}</strong></div><div class="ws-truncate ws-meta">${esc(`${m.weapon} → ${m.evolution}`)}</div></div><span class="ws-pill" data-tone="synergy">+ Equip</span></button>`).join("")}</div>` +
                    `</div>` : "") +
                (d.missingWeapon.length ? `<div class="ws-divider-top ws-stack-sm">` +
                    `<div class="ws-section-label" style="color:#e879f9"><span>Synergistic Weapons for Active Passives (${d.missingWeapon.length})</span></div>` +
                    `<div class="ws-stack-xs">${d.missingWeapon.map((m) => `<button type="button" class="ws-matrix-card" data-action="toggle-weapon" data-name="${esc(m.weapon)}"${(build.weapons || []).length >= CONFIG.SLOTS.MAX_WEAPONS ? " disabled" : ""}><div class="ws-min-0"><div class="ws-truncate" style="font-weight:600">Unseal <strong style="color:#e879f9">${esc(m.weapon)}</strong></div><div class="ws-truncate ws-meta">${esc(`Pairs with ${m.passive} → ${m.evolution}`)}</div></div><span class="ws-pill" data-tone="synergy">+ Equip</span></button>`).join("")}</div>` +
                    `</div>` : "");

            const searchInput = document.getElementById("ws-grid-search");
            if (document.activeElement !== searchInput) searchInput.value = state.gridSearch;
            document.getElementById("ws-search-clear").hidden = !state.gridSearch;

            const tabs = [
                { id: "all", label: "All" },
                { id: "synergy", label: "Synergy", count: d.synergyPickCount },
                { id: "unsealed", label: "Unsealed" },
                { id: "sealed", label: "Sealed" }
            ];
            document.getElementById("ws-filter-tabs").innerHTML = tabs.map((t) =>
                `<button type="button" class="ws-seg-btn" data-action="set-filter" data-val="${t.id}" data-variant="${t.id}" aria-pressed="${state.gridFilter === t.id}"><span>${t.label}</span>${t.count > 0 ? `<span class="ws-seg-count">${t.count}</span>` : ""}</button>`
            ).join("");

            tileIndex = new Map([...d.weaponTiles, ...d.passiveTiles].map((t) => [t.id, t]));
            if (state.inspected) state.inspected = tileIndex.get(state.inspected.id) || null;
            document.getElementById("ws-inspector").innerHTML = renderInspector(state.inspected);

            const anyGrantActive = d.hasArcheotech || d.hasReliquary || d.hasExotic;
            document.getElementById("ws-weapons-meta").innerHTML =
                `<span class="ws-mono-pill">Slots: <strong>${(build.weapons || []).length}</strong> / ${CONFIG.SLOTS.MAX_WEAPONS}</span>` +
                (anyGrantActive ? `<span class="ws-pill" data-tone="grant">+Free Choice</span>` : "") +
                (d.bonusW.length ? `<span class="ws-pill" data-tone="stage">+${d.bonusW.length} Stage</span>` : "");

            document.getElementById("ws-weapons-grid").innerHTML = d.weaponTiles.length
                ? `<div class="ws-grid">${d.weaponTiles.map(renderTile).join("")}</div>`
                : `<div class="ws-grid-empty">No weapon or evolution tiles match the current filter.</div>`;

            document.getElementById("ws-passives-meta").innerHTML =
                `<span class="ws-mono-pill">Slots: <strong>${(build.passives || []).length}</strong> / ${CONFIG.SLOTS.MAX_PASSIVES}</span>` +
                (d.bonusP.length ? `<span class="ws-pill" data-tone="stage">+${d.bonusP.length} Stage</span>` : "");

            document.getElementById("ws-passives-grid").innerHTML = d.passiveTiles.length
                ? `<div class="ws-grid">${d.passiveTiles.map(renderTile).join("")}</div>`
                : `<div class="ws-grid-empty">No passives match the current filter.</div>`;

            const modalEl = document.getElementById("ws-modal");
            modalEl.hidden = !state.shareOpen;
            if (state.shareOpen) {
                const cleanBase = (state.publicSiteUrl || CONFIG.URLS.DEFAULT_SITES).split("#")[0].trim();
                const fullUrl = hash ? `${cleanBase}#${hash}` : cleanBase;
                modalEl.innerHTML = `<div class="ws-modal">` +
                    `<div class="ws-panel-head"><h3 class="ws-heading">${svg("share", 16)}<span>Share or Load Run Build</span></h3><button type="button" data-action="close-share" style="color:var(--zinc-400)">${svg("x", 16)}</button></div>` +
                    (isGoogleSites ? `<div class="ws-callout" data-tone="char" style="margin-top:0;font-size:11px;color:rgba(253,230,138,0.9)">Google Sites embed detected: links automatically target your public Google Sites page URL instead of the internal iframe host.</div>` : "") +
                    `<div><label class="ws-label ws-label-sm" for="ws-site-url">Hosted Page URL</label><input id="ws-site-url" type="text" class="ws-input ws-mono" style="color:var(--zinc-300)" value="${esc(state.publicSiteUrl)}" /></div>` +
                    `<div><label class="ws-label ws-label-sm" for="ws-share-url">Shareable Build Link</label><div class="ws-row"><input id="ws-share-url" type="text" readonly class="ws-input ws-mono" style="color:#6ee7b7" value="${esc(fullUrl)}" /><button type="button" class="ws-btn" data-variant="primary" data-action="copy-share">${svg("copy", 14)}<span>${state.copied ? "Copied!" : "Copy"}</span></button></div></div>` +
                    `<div class="ws-divider-top ws-stack-sm"><label class="ws-label ws-label-sm" style="margin:0" for="ws-import-input">Load Shared Build (Paste URL or #build=... Hash)</label><div class="ws-row"><input id="ws-import-input" type="text" class="ws-input ws-mono" placeholder="https://sites.google.com/...#build=..." value="${esc(state.importText)}" /><button type="button" class="ws-btn" data-variant="amber" data-action="load-share">${svg("upload", 14)}<span>Load</span></button></div>${state.importError ? `<p style="margin:0;font-size:11px;color:#f87171">${esc(state.importError)}</p>` : ""}</div>` +
                    `</div>`;
            }
        }

        /* ==========================================================================
           7. DELEGATED EVENT LISTENERS
           ========================================================================== */
        mountShell();
        render();

        appEl.addEventListener("click", async (e) => {
            const target = e.target.closest("[data-action]");
            if (!target) return;
            const { action, val, name } = target.dataset;

            if (action === "switch-universe" && val !== state.universe) {
                state.universe = val;
                state.charQuery = currentBuild().character || "";
                state.charOpen = false;
                state.inspected = null;
                render();
            } else if (action === "reset-build") {
                state.builds[state.universe] = emptyBuild();
                state.charQuery = "";
                state.gridSearch = "";
                state.gridFilter = "all";
                state.inspected = null;
                render();
            } else if (action === "clear-char") {
                selectCharacter(null);
                render();
            } else if (action === "select-char") {
                selectCharacter(name);
                render();
            } else if (action === "clear-search") {
                state.gridSearch = "";
                render();
            } else if (action === "set-filter") {
                state.gridFilter = val;
                render();
            } else if (action === "toggle-weapon") {
                toggleWeapon(name);
                render();
            } else if (action === "toggle-passive") {
                togglePassive(name);
                render();
            } else if (action === "open-share") {
                state.importError = "";
                state.shareOpen = true;
                render();
                const shareInput = document.getElementById("ws-share-url");
                if (shareInput && await copyShareUrl(shareInput.value)) {
                    state.copied = true;
                    render();
                    setTimeout(() => { state.copied = false; if (state.shareOpen) render(); }, 2500);
                }
            } else if (action === "close-share") {
                state.shareOpen = false;
                render();
            } else if (action === "copy-share") {
                const shareInput = document.getElementById("ws-share-url");
                if (shareInput && await copyShareUrl(shareInput.value)) {
                    state.copied = true;
                    render();
                    setTimeout(() => { state.copied = false; if (state.shareOpen) render(); }, 2500);
                }
            } else if (action === "load-share") {
                const decoded = decodeBuildInput(state.importText);
                if (!decoded) {
                    state.importError = "Invalid link or #build= code. Paste a full planner URL or #build=... hash.";
                    render();
                    return;
                }
                state.universe = decoded.universe;
                state.builds[decoded.universe] = decoded.build;
                state.charQuery = decoded.build.character || "";
                state.importText = "";
                state.importError = "";
                state.shareOpen = false;
                render();
            }
        });

        appEl.addEventListener("input", (e) => {
            const id = e.target.id;
            if (id === "ws-char-input") {
                state.charQuery = e.target.value;
                state.charOpen = true;
                state.charHighlight = 0;
                render();
            } else if (id === "ws-grid-search") {
                state.gridSearch = e.target.value;
                render();
            } else if (id === "ws-site-url") {
                state.publicSiteUrl = e.target.value;
                try { localStorage.setItem("ws_planner_site_url", e.target.value); } catch {}
                const hash = encodeBuildHash(state.universe, currentBuild());
                const cleanBase = (state.publicSiteUrl || CONFIG.URLS.DEFAULT_SITES).split("#")[0].trim();
                const shareInput = document.getElementById("ws-share-url");
                if (shareInput) shareInput.value = hash ? `${cleanBase}#${hash}` : cleanBase;
            } else if (id === "ws-import-input") {
                state.importText = e.target.value;
                state.importError = "";
            }
        });

        appEl.addEventListener("change", (e) => {
            const id = e.target.id;
            if (id === "ws-stage-select") {
                selectMap(e.target.value);
                render();
            } else if (id === "ws-grant-base") {
                updateBuild({ grantBaseWeapon: e.target.value });
                render();
            } else if (id === "ws-reliquary-evo") {
                updateBuild({ reliquaryEvoWeapon: e.target.value });
                render();
            }
        });

        appEl.addEventListener("focusin", (e) => {
            if (e.target.id === "ws-char-input") {
                state.charOpen = true;
                render();
            } else if (e.target.id === "ws-share-url") {
                e.target.select();
            }
        });

        appEl.addEventListener("keydown", (e) => {
            if (e.target.id !== "ws-char-input") return;
            if (!state.charOpen && (e.key === "ArrowDown" || e.key === "Enter")) {
                state.charOpen = true;
                render();
                return;
            }
            if (!state.charOpen) return;
            const list = getFilteredChars();
            if (e.key === "ArrowDown") {
                e.preventDefault();
                state.charHighlight = list.length ? (state.charHighlight + 1) % list.length : 0;
                render();
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                state.charHighlight = list.length ? (state.charHighlight - 1 + list.length) % list.length : 0;
                render();
            } else if (e.key === "Enter") {
                e.preventDefault();
                if (list[state.charHighlight]) {
                    selectCharacter(list[state.charHighlight].name);
                    render();
                }
            } else if (e.key === "Escape") {
                state.charOpen = false;
                render();
            }
        });

        appEl.addEventListener("mouseover", (e) => {
            const tileEl = e.target.closest("[data-tile-id]");
            if (tileEl) {
                const item = tileIndex.get(tileEl.dataset.tileId);
                if (item && state.inspected?.id !== item.id) {
                    state.inspected = item;
                    document.getElementById("ws-inspector").innerHTML = renderInspector(item);
                }
                return;
            }
            const ddItem = e.target.closest("[data-action='select-char']");
            if (ddItem) {
                const idx = Number(ddItem.dataset.idx);
                if (idx !== state.charHighlight) {
                    state.charHighlight = idx;
                    appEl.querySelectorAll(".ws-dd-item").forEach((el, i) => {
                        el.dataset.active = String(i === idx);
                    });
                }
            }
        });

        document.addEventListener("mousedown", (e) => {
            if (state.charOpen && !e.target.closest("#ws-char-box")) {
                state.charOpen = false;
                render();
            }
        });

        window.addEventListener("hashchange", () => {
            const decoded = decodeBuildInput(location.hash);
            if (decoded) {
                state.universe = decoded.universe;
                state.builds[decoded.universe] = decoded.build;
                state.charQuery = decoded.build.character || "";
                render();
            }
        });
    })();
</script>
</body>
</html>
